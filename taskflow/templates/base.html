{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            TaskFlow
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <main class="page-wrapper">

        {% if messages %}
            <div class="messages-container">
                {% for message in messages %}
                    <div class="message message-{{ message.level_tag }} {{ message.extra_tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}


        {% block content %}
        {% endblock %}

    </main>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const autoDismissMessages = document.querySelectorAll('.message:not(.persistent-notif), .alert:not(.persistent-notif)');

        autoDismissMessages.forEach(function (msg) {
            setTimeout(function () {
                msg.style.transition = "opacity 0.5s ease, transform 0.5s ease";
                msg.style.opacity = "0";
                msg.style.transform = "translateY(-10px)";
                setTimeout(function () {
                    msg.remove();
                }, 500);
            }, 4000);
        });
    });
    </script>
</body>
</html>
